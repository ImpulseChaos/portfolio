<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#0d0014"/>
  <rect x="0" y="13" width="100" height="20" fill="#1a0030"/>
  <rect x="0" y="33" width="100" height="13" fill="#2d0050"/>

  <!-- Stars -->
  <circle cx="14" cy="10" r="0.8" fill="#fff" opacity="0.8"/>
  <circle cx="32" cy="6" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="71" cy="14" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="84" cy="7" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="93" cy="22" r="0.7" fill="#fff" opacity="0.6"/>
  <circle cx="7" cy="26" r="0.7" fill="#fff" opacity="0.5"/>

  <!-- Sun -->
  <circle cx="50" cy="49" r="19" fill="#FF2D78"/>
  <!-- Sun scan lines -->
  <rect x="31" y="52" width="38" height="2.5" fill="#0d0014" opacity="0.75"/>
  <rect x="31" y="58" width="38" height="2.5" fill="#0d0014" opacity="0.75"/>
  <rect x="31" y="64" width="38" height="2.5" fill="#0d0014" opacity="0.75"/>

  <!-- Horizon line -->
  <rect x="0" y="65" width="100" height="1.5" fill="#FF2D78" opacity="0.9"/>

  <!-- Grid horizontal lines -->
  <line x1="0" y1="75" x2="100" y2="75" stroke="#BF00FF" stroke-width="0.8" opacity="0.7"/>
  <line x1="0" y1="84" x2="100" y2="84" stroke="#BF00FF" stroke-width="0.8" opacity="0.6"/>
  <line x1="0" y1="92" x2="100" y2="92" stroke="#BF00FF" stroke-width="0.8" opacity="0.5"/>
  <line x1="0" y1="100" x2="100" y2="100" stroke="#BF00FF" stroke-width="0.8" opacity="0.4"/>

  <!-- Grid perspective lines -->
  <line x1="50" y1="66" x2="0" y2="100" stroke="#00EEFF" stroke-width="0.7" opacity="0.5"/>
  <line x1="50" y1="66" x2="20" y2="100" stroke="#00EEFF" stroke-width="0.7" opacity="0.5"/>
  <line x1="50" y1="66" x2="40" y2="100" stroke="#00EEFF" stroke-width="0.7" opacity="0.5"/>
  <line x1="50" y1="66" x2="60" y2="100" stroke="#00EEFF" stroke-width="0.7" opacity="0.5"/>
  <line x1="50" y1="66" x2="80" y2="100" stroke="#00EEFF" stroke-width="0.7" opacity="0.5"/>
  <line x1="50" y1="66" x2="100" y2="100" stroke="#00EEFF" stroke-width="0.7" opacity="0.5"/>

  <!-- Re-clip card corners -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="none" stroke="#0d0014" stroke-width="5"/>
</svg>
